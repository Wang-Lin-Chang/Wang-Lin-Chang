name: align-audit

on:
  push:
    paths:
      - "align-audit.mjs"
      - ".scripts/run-audit-ci.mjs"
      - ".github/workflows/align-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 6" # weekly Saturday, runs after the self-check

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit this repo
        run: |
          node align-audit.mjs .
      - name: Clone all public suite repos and audit them
        run: |
          node .scripts/run-audit-ci.mjs
