name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * 6" # weekly Saturday self-check

jobs:
  index-check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: License, READMEs and suite link self-check
        run: |
          node .scripts/check-links.mjs
